  <body class="landing-page">


<header class="site-header container">
  <a
    class="brand"
    href="index.html"
    aria-label="A27 attendance home"
  >
    <span class="brand-mark">⌂</span>A27
  </a>

  <nav>
    <button
      class="theme-toggle"
      aria-label="Toggle colour theme"
      title="Toggle theme"
    >
      ◐
    </button>
  </nav>
</header>

<main class="container landing-main">
  <section class="hero" aria-labelledby="page-title">

    <p class="eyebrow">
      <span></span>STUDENT ATTENDANCE
    </p>

    <p class="college-name">
      Sree Chaitanya College of Engineering
    </p>

    <h1 id="page-title">
      Check your<br><em>attendance.</em>
    </h1>

    <p class="hero-copy">
      Enter your Hall Ticket Number to view your latest attendance.
    </p>

    <form
      id="attendance-form"
      class="lookup-card"
      novalidate
    >
      <label for="hall-ticket">
        Hall Ticket Number
      </label>

      <div class="input-row">

        <input
          id="hall-ticket"
          name="HallticketNo"
          type="text"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          placeholder="e.g. 23N01A7444"
          aria-describedby="input-help form-error"
          maxlength="25"
        >

        <button
          id="submit-button"
          type="submit"
          value="Login"
          disabled
        >
          <span class="button-text">
            VIEW ATTENDANCE
          </span>

          <span class="button-arrow">→</span>

          <span
            class="spinner"
            aria-hidden="true"
          ></span>
        </button>

      </div>

      <p
        class="input-help"
        id="input-help"
      >
        Enter the Hall Ticket Number issued by your college.
      </p>

      <p
        id="form-error"
        class="form-error"
        role="alert"
      ></p>

      <button class="forgot-ticket-button" id="forgot-ticket-button" type="button">Forgot Hall Ticket Number?</button>
      <div class="forgot-ticket-form" id="forgot-ticket-form" hidden>
        <label for="forgot-name">Any 4 letters of your name</label>
        <div class="input-row">
          <input id="forgot-name" type="text" autocomplete="name" maxlength="80">
          <button id="forgot-search-button" type="button">SEARCH</button>
        </div>
        <p class="form-error" id="forgot-error" role="alert"></p>
        <div class="forgot-results" id="forgot-results"></div>
      </div>
    </form>

  </section>
</main>

<footer class="container">
  <span>© 2026 A27</span>
  <span>Independent student interface</span>
